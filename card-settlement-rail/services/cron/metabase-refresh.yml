name: Metabase Refresh
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Metabase database metadata
        if: ${{ vars.ENABLE_METABASE_REFRESH == 'true' }}
        env:
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_DATABASE_ID: ${{ vars.METABASE_DATABASE_ID }}
        run: |
          test -n "$METABASE_URL"
          test -n "$METABASE_API_KEY"
          test -n "$METABASE_DATABASE_ID"
          curl --fail-with-body --silent --show-error \
            -X POST "$METABASE_URL/api/database/$METABASE_DATABASE_ID/sync_schema" \
            -H "X-API-Key: $METABASE_API_KEY"
